name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy --ignore-missing-imports .

      - name: Test
        run: pytest -q
        env:
          # Deliberately no API keys — ensures no live calls in CI
          CRUSTDATA_API_KEY: ""
          OPENAI_API_KEY: ""
